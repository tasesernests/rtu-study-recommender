[theme]
# RTU brand colours — clean, modern light theme
primaryColor = "#c8102e"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a202c"
font = "sans serif"

[server]
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
