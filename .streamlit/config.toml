[theme]
# Neutral, professional light theme with RTU red reserved for small accents
primaryColor = "#374151"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
font = "sans serif"

[server]
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
